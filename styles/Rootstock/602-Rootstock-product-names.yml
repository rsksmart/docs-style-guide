extends: substitution
message: "Use '%s' instead of '%s'"
link: https://docs.ubuntu.com/styleguide/en/#other-canonical-products
ignorecase: true
level: error
action:
  name: replace
swap:
  - '(?!(https://public-node\.testnet\.rsk\.co|https://public-node\.rsk\.co))RSK': Rootstock
  - Rif: RIF
  - RSKJ: RSKj
  - rskJ: RSKj
  - RootStock: Rootstock
  - Rns: RNS
  - rbtc: rBTC
  - Dapp: dApp
  - RLogin: rLogin
  - RWallet: rWallet
  - Tokenbridge: Token Bridge
  - FlyOver: Flyover
  - Powpeg: PowPeg